version: '3.8'

services:
  measurement-system:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: 3d-measurement:gpu-v2
    container_name: 3d-measurement-gpu
    
    ports:
      - "8000:8000"
    
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - LOG_LEVEL=INFO
    
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./data:/app/data
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    networks:
      - measurement-network

networks:
  measurement-network:
    driver: bridge

